<!doctype html><html><head><meta charset="utf-8"><title>Preflash panels</title>
<!-- Source for panels.png. Each frame comes from preflash shot against examples/demo: capture.sh saves them, and render.sh draws this page. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="screen.css">
<style>
html,body{width:1440px;height:460px}
body{display:flex;align-items:center;justify-content:center;gap:24px}
figure{display:flex;flex-direction:column;gap:12px}
.pair{display:flex;gap:16px}
.square{width:360px;height:360px}
.long{width:97px;height:360px}
</style></head><body>
<figure><img class="panel square" src="4b-faults.png" alt=""><figcaption>4B, RTC off the bus</figcaption></figure>
<figure><img class="panel square" src="4b-turned.png" alt=""><figcaption>4B, turned a quarter</figcaption></figure>
<figure><img class="panel square" src="4b-power.png" alt=""><figcaption>4B, battery at 15%</figcaption></figure>
<figure><div class="pair"><img class="panel long" src="349-faults.png" alt=""><img class="panel long" src="349-network.png" alt=""></div><figcaption>3.49 V2</figcaption></figure>
</body></html>
