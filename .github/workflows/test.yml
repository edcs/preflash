name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install sdl2 bash
      - run: make test
        env:
          # A runner builds each fixture cold, slower than the 10 s a warm Mac needs.
          PREFLASH_TEST_WAIT: "300"
