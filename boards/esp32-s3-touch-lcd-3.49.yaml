# Values follow Waveshare's V2 examples. V1 boards swap LCD_BL with EXIO_INT and
# LCD_TE with LCD_RST, so a V1 board needs a file of its own.
name: ESP32-S3-Touch-LCD-3.49-V2
display:
  controller: axs15231b
  width: 172
  height: 640
  byte_order: be
i2c:
  - {chip: tca9554, address: 0x20}
  - {chip: qmi8658, address: 0x6b}
  - {chip: pcf85063, address: 0x51}
  - {chip: axs15231b, address: 0x3b, bus: 1}
backlight:
  pin: gpio42
  active_low: true
  enable: exio1
# Buttons, in strip order, from Waveshare's ESP32-S3-Touch-LCD-3.49-Schematic.pdf (the file on
# the board's wiki page, dated 2025-11-28, which carries no V1 or V2 mark): Key1 is BOOT on
# IO0, Key2 is RESET on the module's EN, and Key3 is the power key, with SYS_OUT on IO16 and
# SYS_EN on EXIO6 (the hold, which the firmware drives high to stay on). The key is active low.
buttons:
  - {name: PWR, power: {key: gpio16, active_low: true, hold: tca9554.6}}
  - {name: BOOT, gpio: gpio0, active_low: true}
  - {name: RST, reset: en}
